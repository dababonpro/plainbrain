[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plainbrain"
dynamic = ["version"]
description = "A local commitment and work-loop system in plain Markdown for people running AI agents across projects: one commitment list your agent proposes to and you approve, an append-only inbox guarded by hooks, deterministic daily briefs, searchable notes, and a local MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DababonPro IT Solutions" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = ["pytest"]

[project.urls]
Homepage = "https://dababon.pro/plainbrain/"
Repository = "https://github.com/dababonpro/plainbrain"
Issues = "https://github.com/dababonpro/plainbrain/issues"

[project.scripts]
plainbrain = "plainbrain.cli:main"
plainbrain-mcp = "plainbrain.mcp_server:main"
plainbrain-guard = "plainbrain.inbox_guard:main"
plainbrain-nudge = "plainbrain.capture_nudge:main"

[tool.hatch.version]
path = "plainbrain/__init__.py"

# A source archive takes every file .gitignore does not exclude, tracked or not, so name what goes in.
# It must hold the package, every force-include source below, and the files the metadata names.
[tool.hatch.build.targets.sdist]
include = [
    "/plainbrain",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/LICENSE",
    "/LICENSE-docs",
    "/README.md",
    "/CHANGELOG.md",
    "/templates",
    "/views",
    "/knowledge",
    "/.claude/skills",
    "/.agents/skills",
    "/.gemini/settings.json",
]

[tool.hatch.build.targets.wheel]
packages = ["plainbrain"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "plainbrain/_assets/AGENTS.md"
"CLAUDE.md" = "plainbrain/_assets/CLAUDE.md"
"LICENSE" = "plainbrain/_assets/LICENSE"
"LICENSE-docs" = "plainbrain/_assets/LICENSE-docs"
"templates" = "plainbrain/_assets/templates"
"views" = "plainbrain/_assets/views"
"knowledge" = "plainbrain/_assets/knowledge"
".claude/skills" = "plainbrain/_assets/.claude/skills"
".agents/skills" = "plainbrain/_assets/.agents/skills"
".gemini/settings.json" = "plainbrain/_assets/.gemini/settings.json"
