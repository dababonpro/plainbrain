    <text x="1084" y="292" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#fbfaf4">Daily</text>
    <text x="1084" y="320" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#fbfaf4">brief</text>
